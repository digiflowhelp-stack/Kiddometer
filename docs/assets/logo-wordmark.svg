<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 220" width="820" height="220" role="img" aria-label="Kiddometer">
  <defs>
    <linearGradient id="wmDial" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8f7bff"/>
      <stop offset="1" stop-color="#5a41e0"/>
    </linearGradient>
    <linearGradient id="wmStar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd76a"/>
      <stop offset="1" stop-color="#f5a524"/>
    </linearGradient>
    <linearGradient id="wmText" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a2a6b"/>
      <stop offset="1" stop-color="#7B61FF"/>
    </linearGradient>
    <filter id="wmShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#3a2a6b" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- Icon (scaled copy of the app mark) -->
  <g transform="translate(22 22) scale(0.352)">
    <rect x="0" y="0" width="500" height="500" rx="118" fill="url(#wmDial)" filter="url(#wmShadow)"/>
    <g fill="none" stroke-width="44" stroke-linecap="round">
      <path d="M118 320 A142 142 0 0 1 196 200" stroke="#20a05f"/>
      <path d="M196 200 A142 142 0 0 1 320 164" stroke="#7cb342"/>
      <path d="M320 164 A142 142 0 0 1 418 232" stroke="#f39c12"/>
      <path d="M418 232 A142 142 0 0 1 428 320" stroke="#e74c3c"/>
    </g>
    <line x1="256" y1="352" x2="176" y2="238" stroke="#ffffff" stroke-width="22" stroke-linecap="round"/>
    <circle cx="256" cy="352" r="38" fill="#ffffff"/>
    <circle cx="256" cy="352" r="16" fill="#5a41e0"/>
    <path d="M150 150 l10.5 24.5 24.5 10.5 -24.5 10.5 -10.5 24.5 -10.5 -24.5 -24.5 -10.5 24.5 -10.5 z" fill="url(#wmStar)"/>
    <g transform="translate(292 196) rotate(10)">
      <rect x="0" y="20" width="104" height="72" rx="12" fill="#ffffff"/>
      <rect x="0" y="20" width="104" height="22" rx="10" fill="#20a05f"/>
      <path d="M8 20 L28 6 L46 6 L26 20 Z" fill="#20a05f"/>
      <path d="M46 20 L66 6 L84 6 L64 20 Z" fill="#20a05f"/>
      <circle cx="28" cy="64" r="10" fill="#7B61FF"/>
      <rect x="48" y="55" width="42" height="8" rx="4" fill="#c9c1ea"/>
      <rect x="48" y="69" width="30" height="8" rx="4" fill="#c9c1ea"/>
    </g>
  </g>

  <!-- Wordmark -->
  <text x="228" y="118" font-family="'Funnel Sans','Inter',system-ui,sans-serif" font-size="88" font-weight="800" letter-spacing="-2" fill="url(#wmText)">Kiddometer</text>
  <text x="232" y="156" font-family="'Inter',system-ui,sans-serif" font-size="23" font-weight="600" letter-spacing="4" fill="#8a83a6">IS IT RIGHT FOR YOUR KID?</text>
